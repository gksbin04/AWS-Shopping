<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동물 구매 쇼핑몰</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- 헤더 -->
        <header class="header">
            <div class="container">
                <h1 class="logo">🐾 동물 구매 쇼핑몰</h1>
                <div class="header-right">
                    <button id="cartBtn" class="cart-button">
                        🛒 장바구니 <span id="cartCount" class="cart-count">0</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- 메인 콘텐츠 -->
        <main class="main">
            <div class="container">
                <section class="products-section">
                    <h2>상품 목록</h2>
                    <div id="productList" class="product-grid">
                        <!-- 상품이 여기에 렌더링됨 -->
                    </div>
                </section>
            </div>
        </main>

        <!-- 장바구니 모달 -->
        <div id="cartModal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>🛒 장바구니</h2>
                    <button id="closeCartBtn" class="close-btn">&times;</button>
                </div>
                <div id="cartItems" class="cart-items">
                    <!-- 장바구니 항목이 여기에 렌더링됨 -->
                </div>
                <div class="cart-summary">
                    <div class="summary-row">
                        <span>총 금액:</span>
                        <span id="totalPrice" class="total-price">0원</span>
                    </div>
                    <button id="checkoutBtn" class="checkout-btn">구매하기</button>
                </div>
            </div>
        </div>

        <!-- 구매 완료 메시지 -->
        <div id="successMessage" class="success-message hidden">
            <div class="success-content">
                <h2>✅ 구매가 완료되었습니다!</h2>
                <p id="successText"></p>
                <button id="continueShoppingBtn" class="continue-btn">계속 쇼핑하기</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
